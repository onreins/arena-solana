# Checks the live app every 3 hours: Arena configured, the gasless relayer on
# and funded, the validator set and funded, the chain reachable
# (GET /api/callbook/health). A problem fails this job, and GitHub emails the
# repository's watchers about a failed scheduled run.
#
# GitHub runs scheduled workflows from the default branch only. Set the
# repository variable APP_URL to check another deployment.
name: Health check

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the app
        env:
          APP_URL: ${{ vars.APP_URL || 'https://app.reins.one' }}
        run: |
          body=$(curl -sf --max-time 60 "$APP_URL/api/callbook/health") || { echo "::error::$APP_URL/api/callbook/health didn't answer"; exit 1; }
          echo "$body"
          ok=$(echo "$body" | jq -r '.ok')
          if [ "$ok" != "true" ]; then
            # The app's sentences become annotations: no workflow commands can ride along in them.
            echo "$body" | jq -r '.problems[] | gsub("[\\r\\n]"; " ") | gsub("::"; ": ")' | while read -r p; do echo "::error::$p"; done
            exit 1
          fi
