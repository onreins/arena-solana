<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
// Arena's coins, in the style of Kraken's banner art: thick dark-metal coins with a raised rim,
// Arena's lock-and-check mark stamped on the face, a cool key light and a violet rim light.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const W = 1400, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
// A dim violet room: the metal reflects it, so the coins read dark but not black.
scene.background = null;

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
camera.position.set(0, 0, 13);

// The coin: a lathe profile with a raised rim and a slightly sunken face.
const R = 1.6, T = 0.34;
const prof = [
  [0, T * 0.36], [R * 0.80, T * 0.36], [R * 0.84, T * 0.5], [R * 0.95, T * 0.5], [R, T * 0.38],
  [R, -T * 0.38], [R * 0.95, -T * 0.5], [R * 0.84, -T * 0.5], [R * 0.80, -T * 0.36], [0, -T * 0.36],
].map(([x, y]) => new THREE.Vector2(x, y));
const body = new THREE.LatheGeometry(prof, 160);
body.rotateX(Math.PI / 2);

// The mark: Arena's lock with a check (ui.js "callbook" icon), drawn as a bump map for the face.
function markTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 1024;
  const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, 1024, 1024);
  g.save();
  g.translate(512, 512); g.scale(26, 26); g.translate(-12, -12.6);
  g.filter = "blur(3px)";
  g.strokeStyle = "#fff"; g.lineWidth = 2.1; g.lineCap = "round"; g.lineJoin = "round";
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); g.stroke(); };
  rr(4.5, 10, 15, 10.5, 2.2);
  g.beginPath(); g.moveTo(8, 10); g.lineTo(8, 7.6); g.arc(12, 7.6, 4, Math.PI, 0); g.lineTo(16, 10); g.stroke();
  g.beginPath(); g.moveTo(9.3, 15.3); g.lineTo(11.2, 17.2); g.lineTo(14.8, 13.6); g.stroke();
  g.restore();
  // An engraved ring just inside the rim.
  g.strokeStyle = "#7a7a7a"; g.lineWidth = 6;
  g.beginPath(); g.arc(512, 512, 470, 0, Math.PI * 2); g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 8;
  return t;
}
const mark = markTexture();

const metal = new THREE.MeshPhysicalMaterial({ color: 0x77738a, metalness: 0.95, roughness: 0.3, envMapIntensity: 1.3, clearcoat: 0.7, clearcoatRoughness: 0.2 });
const face = new THREE.MeshPhysicalMaterial({ color: 0x3c3a4a, metalness: 0.85, roughness: 0.5, envMapIntensity: 0.9, bumpMap: mark, bumpScale: 4, clearcoat: 0.45, clearcoatRoughness: 0.35 });

function coin() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(body, metal));
  const disc = new THREE.CircleGeometry(R * 0.8, 128);
  const front = new THREE.Mesh(disc, face);
  front.position.z = T * 0.36 + 0.001;
  const back = new THREE.Mesh(disc, face);
  back.rotation.y = Math.PI; back.position.z = -T * 0.36 - 0.001;
  g.add(front, back);
  return g;
}

// Three coins, placed and tilted like Kraken's.
[
  { p: [-2.6, 1.05, 0], r: [0.25, 0.55, -0.2], s: 1.0 },
  { p: [2.75, 1.75, -1.2], r: [0.15, -0.55, 0.25], s: 0.92 },
  { p: [1.15, -1.95, 0.6], r: [0.45, -0.25, 0.12], s: 0.98 },
].forEach(({ p, r, s }) => {
  const c = coin();
  c.position.set(...p); c.rotation.set(...r); c.scale.setScalar(s);
  scene.add(c);
});

// Light: a soft key from the upper left, a violet rim from behind right, a faint fill.
const key = new THREE.DirectionalLight(0xe9e6ff, 2.4); key.position.set(-5, 6, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0x8b6cff, 5.5); rim.position.set(6, 2, -6); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0x6f5cff, 2.2); rim2.position.set(-6, -3, -4); scene.add(rim2);
scene.add(new THREE.AmbientLight(0x1a1630, 0.6));
// A soft front light from above: a gentle sheen across each face, as on Kraken's coins.
const front = new THREE.PointLight(0xc9c2ff, 60, 30, 1.6); front.position.set(-1.5, 4.5, 7); scene.add(front);

renderer.render(scene, camera);
document.title = "rendered";
</script>
</body>
</html>
