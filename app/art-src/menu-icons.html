<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #16131f; color: #ccc; font: 12px sans-serif; } canvas { display: inline-block; margin: 6px; background: #1d1a29; border-radius: 14px; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
// The phone menu's tile icons, as small 3D objects in the style of Vivid's pocket tiles and
// Arena's coins: lavender-silver metal with a violet rim light, one object per page.
// Each renders to its own 512px canvas; save() posts them to the art studio as PNGs.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const S = 192;
const metal = (color = 0xb9b2d6, rough = 0.28) => new THREE.MeshPhysicalMaterial({ color, metalness: 0.9, roughness: rough, envMapIntensity: 1.25, clearcoat: 0.8, clearcoatRoughness: 0.18 });
const glow = (color) => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.6, roughness: 0.4 });
const rbox = (w, h, d, r) => new RoundedBoxGeometry(w, h, d, 6, r);

// The lock-and-check mark, as a bump map (the same as the banner coins).
function markTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, 512, 512);
  g.filter = "blur(2px)";
  g.save(); g.translate(256, 256); g.scale(13, 13); g.translate(-12, -12.6);
  g.strokeStyle = "#fff"; g.lineWidth = 2.1; g.lineCap = "round"; g.lineJoin = "round";
  g.beginPath(); g.roundRect(4.5, 10, 15, 10.5, 2.2); g.stroke();
  g.beginPath(); g.moveTo(8, 10); g.lineTo(8, 7.6); g.arc(12, 7.6, 4, Math.PI, 0); g.lineTo(16, 10); g.stroke();
  g.beginPath(); g.moveTo(9.3, 15.3); g.lineTo(11.2, 17.2); g.lineTo(14.8, 13.6); g.stroke();
  g.restore();
  return new THREE.CanvasTexture(c);
}

const OBJECTS = {
  // Agents: an AI chip, two glowing eyes.
  agents() {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(rbox(2.2, 1.9, 1.1, 0.42), metal()));
    const face = new THREE.Mesh(rbox(1.7, 1.15, 0.2, 0.09), new THREE.MeshPhysicalMaterial({ color: 0x1b1730, metalness: 0.4, roughness: 0.25, clearcoat: 1 }));
    face.position.set(0, -0.05, 0.5); g.add(face);
    [-0.38, 0.38].forEach((x) => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.14, 32, 16), glow(0x9d84ff)); e.position.set(x, 0, 0.62); g.add(e); });
    const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.45, 16), metal()); ant.position.set(0, 1.18, 0); g.add(ant);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 12), glow(0x9d84ff)); tip.position.set(0, 1.44, 0); g.add(tip);
    g.rotation.set(0.12, -0.45, 0.04);
    return g;
  },
  // Strategies: three rising bars on a base.
  strategies() {
    const g = new THREE.Group();
    [[-0.75, 0.9], [0, 1.45], [0.75, 2.05]].forEach(([x, h], i) => {
      const b = new THREE.Mesh(rbox(0.58, h, 0.58, 0.14), i === 2 ? metal(0xc9bcff, 0.22) : metal());
      b.position.set(x, h / 2 - 1.05, 0); g.add(b);
    });
    const base = new THREE.Mesh(rbox(2.5, 0.16, 0.9, 0.07), metal(0x8c86a6)); base.position.y = -1.13; g.add(base);
    g.rotation.set(0.28, -0.6, 0);
    return g;
  },
  // Arena: the lock coin.
  arena() {
    const R = 1.25, T = 0.3;
    const prof = [[0, T * .36], [R * .8, T * .36], [R * .84, T * .5], [R * .95, T * .5], [R, T * .38], [R, -T * .38], [R * .95, -T * .5], [R * .84, -T * .5], [R * .8, -T * .36], [0, -T * .36]].map(([x, y]) => new THREE.Vector2(x, y));
    const body = new THREE.LatheGeometry(prof, 120); body.rotateX(Math.PI / 2);
    const g = new THREE.Group();
    g.add(new THREE.Mesh(body, metal()));
    const face = new THREE.Mesh(new THREE.CircleGeometry(R * .8, 96), new THREE.MeshPhysicalMaterial({ color: 0xa79fd0, metalness: 0.9, roughness: 0.36, bumpMap: markTexture(), bumpScale: 3, clearcoat: 0.6 }));
    face.position.z = T * .36 + 0.002; g.add(face);
    g.rotation.set(0.15, -0.5, 0.08);
    return g;
  },
  // Chat: a speech bubble with three dots.
  chat() {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(rbox(2.3, 1.6, 0.7, 0.5), metal()));
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.6, 24), metal());
    tail.position.set(-0.55, -0.92, 0); tail.rotation.z = Math.PI * 0.85; g.add(tail);
    [-0.5, 0, 0.5].forEach((x) => { const d = new THREE.Mesh(new THREE.SphereGeometry(0.15, 24, 12), glow(0x9d84ff)); d.position.set(x, 0.02, 0.36); g.add(d); });
    g.rotation.set(0.1, -0.45, 0.05);
    return g;
  },
  // Charts: three candles, wicks and bodies.
  charts() {
    const g = new THREE.Group();
    [[-0.75, -0.25, 0.9, 0x3ddc97], [0, 0.25, 1.3, 0xf07a8a], [0.75, 0.45, 1.1, 0x3ddc97]].forEach(([x, y, h, c]) => {
      const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, h + 0.9, 12), metal(0x9993b3)); wick.position.set(x, y, 0); g.add(wick);
      const body = new THREE.Mesh(rbox(0.46, h, 0.46, 0.1), new THREE.MeshPhysicalMaterial({ color: c, metalness: 0.55, roughness: 0.3, clearcoat: 0.9, envMapIntensity: 1.1 }));
      body.position.set(x, y, 0); g.add(body);
    });
    g.rotation.set(0.2, -0.55, 0);
    return g;
  },
  // Create agent: a plus.
  create() {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(rbox(2.1, 0.62, 0.62, 0.22), metal(0xc9bcff, 0.22)));
    g.add(new THREE.Mesh(rbox(0.62, 2.1, 0.62, 0.22), metal(0xc9bcff, 0.22)));
    g.rotation.set(0.3, -0.6, 0.2);
    return g;
  },
};

function render(name) {
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(S, S); r.setClearColor(0, 0);
  r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05; r.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.03).texture;
  const cam = new THREE.PerspectiveCamera(28, 1, 0.1, 50); cam.position.set(0, 0, 7);
  scene.add(OBJECTS[name]());
  const key = new THREE.DirectionalLight(0xf1eeff, 2.6); key.position.set(-4, 6, 7); scene.add(key);
  const rim = new THREE.DirectionalLight(0x8b6cff, 5); rim.position.set(5, 2, -5); scene.add(rim);
  const rim2 = new THREE.DirectionalLight(0x6f5cff, 2); rim2.position.set(-5, -3, -3); scene.add(rim2);
  scene.add(new THREE.AmbientLight(0x2a2440, 0.7));
  r.render(scene, cam);
  r.domElement.dataset.name = name;
  document.body.appendChild(r.domElement);
}
Object.keys(OBJECTS).forEach(render);
window.save = async () => {
  const out = [];
  for (const c of document.querySelectorAll("canvas")) {
    out.push(await fetch("/save?name=ic-" + c.dataset.name + ".png", { method: "POST", body: c.toDataURL("image/png") }).then((x) => x.text()));
  }
  return out;
};
document.title = "rendered";
</script>
</body>
</html>
