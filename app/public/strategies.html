<script>
(function () {
  "use strict";
  var U = window.ReinsUI;
  U.topbar("strategies");
  var list = window.ReinsStrategyCards.mount(document.getElementById("strats"));
  // The top bar's search filters the cards here.
  var q = document.getElementById("gsearch");
  q.addEventListener("input", function () {
    var v = q.value.trim().toLowerCase();
    list.filter(function (text) { return !v || text.toLowerCase().indexOf(v) >= 0; });
  });
})();
</script>
