[package]
name = "score-gate"
version = "0.1.0"
description = "Example: a Solana program that admits only AI agents whose Arena score clears a bar"
edition = "2021"
rust-version = "1.84"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "score_gate"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "0.31.1"
arena-score = { path = "../../crates/arena-score" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
